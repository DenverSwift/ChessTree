<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessTree</title>
    <link rel="stylesheet" href="css/home.css" />
</head>
<body>
<canvas id="bg-network" aria-hidden="true"></canvas>

<header class="topbar">
    <a href="#contact" class="nav-link">Contact us</a>
    <a href="#about" class="nav-link">About</a>
    <a href="#news" class="nav-link">News</a>
    <a href="library.html" class="nav-link">Library</a>
    <a href="#settings" class="nav-link">Settings</a>
    <button id="accountBtn" class="account-btn" type="button">Log in / Register</button>
</header>

<main class="hero">
    <h1 id="heroText" class="hero-text">Explore new openings</h1>

    <form id="searchForm" class="search-wrap" action="library.html" method="get" autocomplete="off">
        <label for="openingSearch" class="sr-only">Search for an opening</label>
        <input id="openingSearch" type="text" placeholder="Search for an opening..." aria-expanded="false" aria-controls="openingList" />
        <button id="searchGo" type="submit" aria-label="Go to library">&#10132;</button>
        <ul id="openingList" class="opening-list" role="listbox"></ul>
    </form>
</main>

<script src="js/home.js"></script>
</body>
</html>
