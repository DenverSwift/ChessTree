<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessTree Contact</title>
    <link rel="icon" type="image/png" href="img/new-logo.png" />
    <script>
        (() => {
            const storageKey = "chess_tree_theme";
            let theme = "dark";
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved === "dark" || saved === "light") {
                    theme = saved;
                }
            } catch (_error) {
                theme = "dark";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="css/theme.css?v=20260402b" />
    <link rel="stylesheet" href="css/contact.css?v=20260402c" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a href="index.html" class="brand-link" aria-label="ChessTree Home">
            <img class="brand-logo" src="img/new-logo.png" alt="" aria-hidden="true" />
            <span class="brand-text">ChessTree</span>
        </a>

        <nav class="topbar-links" aria-label="Primary">
            <a href="index.html" class="nav-link">
                <svg class="nav-icon nav-icon--home" viewBox="0 0 40 44" fill="none" aria-hidden="true">
                    <path d="M14 42V22H26V42M2 16L20 2L38 16V38C38 39.0609 37.5786 40.0783 36.8284 40.8284C36.0783 41.5786 35.0609 42 34 42H6C4.93913 42 3.92172 41.5786 3.17157 40.8284C2.42143 40.0783 2 39.0609 2 38V16Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="library.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20V18.5A2.5 2.5 0 0 0 17.5 16H4V5.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 16V18.5A2.5 2.5 0 0 0 6.5 21H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Library</span>
            </a>
            <span class="nav-link nav-link--disabled" aria-disabled="true" data-tooltip="Under construction">
                <svg class="nav-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
                    <path d="M22 42C33.0457 42 42 33.0457 42 22C42 10.9543 33.0457 2 22 2C10.9543 2 2 10.9543 2 22C2 33.0457 10.9543 42 22 42Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M30.48 13.52L26.24 26.24L13.52 30.48L17.76 17.76L30.48 13.52Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Explorer</span>
            </span>
            <a href="contact.html" class="nav-link nav-link--active" aria-current="page">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Contact</span>
            </a>
        </nav>
    </div>
    <div class="topbar-glow" aria-hidden="true"></div>
</header>

<main class="contact-main">
    <section class="contact-hero">
        <div class="contact-hero__icon-wrap" aria-hidden="true">
            <svg class="contact-hero__icon" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-subtitle">Have questions or feedback? We'd love to hear from you.</p>
    </section>

    <section class="contact-card" aria-label="Contact form">
        <form id="contactForm" class="contact-form" novalidate>
            <label class="contact-field">
                <span class="contact-label">Name</span>
                <input class="contact-input" type="text" name="name" placeholder="Your name" required />
            </label>

            <label class="contact-field">
                <span class="contact-label">Email</span>
                <input class="contact-input" type="email" name="email" placeholder="your.email@example.com" required />
            </label>

            <label class="contact-field">
                <span class="contact-label">Message</span>
                <textarea class="contact-input contact-textarea" name="message" placeholder="Your message..." rows="4" maxlength="2000" required></textarea>
            </label>

            <button id="contactSubmit" class="contact-submit" type="submit">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Send Message</span>
            </button>
        </form>
    </section>
</main>

<script src="js/theme-switcher.js"></script>
<script src="js/toolbar-tooltip.js?v=20260401a"></script>
<script src="js/contact.js?v=20260401b"></script>
<a href="help/getting-started.html" class="help-fab" aria-label="Open help" title="Help" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <path d="M9.9 9.2C10.2 8.2 11 7.5 12.2 7.5C13.5 7.5 14.5 8.3 14.5 9.6C14.5 10.7 13.9 11.3 13.1 11.8C12.3 12.3 12 12.8 12 13.6V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1.2" fill="currentColor"/>
    </svg>
</a>
</body>
</html>
