<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explorer - ChessTree</title>
    <link rel="icon" type="image/png" href="img/new-logo.png" />
    <script>
        (() => {
            const storageKey = "chess_tree_theme";
            let theme = "dark";
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved === "dark" || saved === "light") {
                    theme = saved;
                }
            } catch (_error) {
                theme = "dark";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="css/theme.css?v=20260402b" />
    <link rel="stylesheet" href="css/explorer.css?v=20260428e" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a href="index.html" class="brand-link" aria-label="ChessTree Home">
            <img class="brand-logo" src="img/new-logo.png" alt="" aria-hidden="true" />
            <span class="brand-text">ChessTree</span>
        </a>

        <nav class="topbar-links" aria-label="Primary">
            <a href="index.html" class="nav-link">
                <svg class="nav-icon nav-icon--home" viewBox="0 0 40 44" fill="none" aria-hidden="true">
                    <path d="M14 42V22H26V42M2 16L20 2L38 16V38C38 39.0609 37.5786 40.0783 36.8284 40.8284C36.0783 41.5786 35.0609 42 34 42H6C4.93913 42 3.92172 41.5786 3.17157 40.8284C2.42143 40.0783 2 39.0609 2 38V16Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Home</span>
            </a>
            <a href="library.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20V18.5A2.5 2.5 0 0 0 17.5 16H4V5.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M4 16V18.5A2.5 2.5 0 0 0 6.5 21H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Library</span>
            </a>
            <a href="explorer.html?source=toolbar" class="nav-link nav-link--active" aria-current="page">
                <svg class="nav-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
                    <path d="M22 42C33.0457 42 42 33.0457 42 22C42 10.9543 33.0457 2 22 2C10.9543 2 2 10.9543 2 22C2 33.0457 10.9543 42 22 42Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M30.48 13.52L26.24 26.24L13.52 30.48L17.76 17.76L30.48 13.52Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Explorer</span>
            </a>
            <a href="contact.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Contact</span>
            </a>
        </nav>
    </div>
    <div class="topbar-glow" aria-hidden="true"></div>
</header>

<main class="explorer-page">
    <section id="explorerStage" class="explorer-stage" aria-label="Explorer workspace">
        <div class="tree-layer">
            <div class="tree-grid" aria-hidden="true"></div>

            <div class="tree-header">
                <div class="tree-header__copy">
                    <p id="explorerEyebrow" class="explorer-eyebrow">Explorer</p>
                    <h1 id="openingTitle" class="explorer-title">Starting Position</h1>
                    <p id="openingSubtitle" class="explorer-subtitle">Open an opening or a variation to inspect a move tree.</p>
                </div>

                <div class="tree-header__actions">
                    <button id="resumeLastOpeningBtn" class="control-btn control-btn--secondary" type="button" hidden>
                        Resume Last Tree
                    </button>
                    <button id="focusActiveNodeBtn" class="control-btn" type="button">
                        Focus Current Move
                    </button>
                </div>
            </div>

            <div id="treeViewport" class="tree-viewport" role="img" aria-label="Opening move tree">
                <svg id="treeConnections" class="tree-connections" aria-hidden="true">
                    <g id="treeConnectionsGroup"></g>
                </svg>
                <div id="treeNodesLayer" class="tree-nodes-layer"></div>
            </div>

            <div class="tree-footer">
                <div class="tree-footer__block">
                    <span class="tree-footer__label">Current Line</span>
                    <p id="currentLineMoves" class="tree-footer__value">Start position</p>
                </div>
            </div>

            <button id="restoreBoardPanelBtn" class="tree-restore-btn" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8" />
                    <path d="M8 4V20M12 4V20M16 4V20M4 8H20M4 12H20M4 16H20" stroke="currentColor" stroke-width="1.3" />
                </svg>
                <span>&#1042;&#1077;&#1088;&#1085;&#1091;&#1090;&#1100; &#1076;&#1077;&#1088;&#1077;&#1074;&#1086;</span>
            </button>

            <div id="treeZoomToast" class="tree-zoom-toast" aria-live="polite" aria-hidden="true">
                <span class="tree-zoom-toast__label">Zoom</span>
                <span id="treeZoomToastValue" class="tree-zoom-toast__value">100%</span>
            </div>
        </div>

        <aside id="boardPanel" class="board-panel" aria-label="Board panel">
            <div class="board-panel__top-row">
                <button id="boardDragHandleTop" class="board-panel__grip board-panel__grip--top" type="button" aria-label="Move preview panel">
                    <span class="board-panel__grip-lines" aria-hidden="true"></span>
                </button>
                <button id="hideBoardPanelBtn" class="board-panel__hide" type="button" aria-label="Collapse preview panel">
                    <span aria-hidden="true">&#10005;</span>
                </button>
            </div>

            <div class="board-frame">
                <div id="chessboard" class="chessboard" role="img" aria-label="Chess position"></div>
            </div>

            <div class="board-panel__footer-row">
                <div class="board-panel__meta">
                    <span id="difficultyBadge" class="tone-badge">Default</span>
                    <span id="lineBadge" class="tone-chip">No line selected</span>
                </div>
                <button id="boardDragHandleBottom" class="board-panel__grip board-panel__grip--bottom" type="button" aria-label="Move preview panel">
                    <span class="board-panel__grip-lines" aria-hidden="true"></span>
                </button>
            </div>

            <div class="board-panel__resize-handles" aria-hidden="true">
                <button class="board-panel__resize-handle board-panel__resize-handle--n" type="button" data-resize-direction="n" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--s" type="button" data-resize-direction="s" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--e" type="button" data-resize-direction="e" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--w" type="button" data-resize-direction="w" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--ne" type="button" data-resize-direction="ne" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--nw" type="button" data-resize-direction="nw" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--se" type="button" data-resize-direction="se" aria-label="Resize preview"></button>
                <button class="board-panel__resize-handle board-panel__resize-handle--sw" type="button" data-resize-direction="sw" aria-label="Resize preview"></button>
            </div>
        </aside>
    </section>
</main>

<script src="js/toolbar-tooltip.js?v=20260402a"></script>
<script src="js/opening-token.js?v=20260404a"></script>
<script src="js/explorer.js?v=20260428e"></script>
</body>
</html>
