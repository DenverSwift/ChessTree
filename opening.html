<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening - ChessTree</title>
    <link rel="icon" type="image/png" href="img/new-logo.png" />
    <script>
        (() => {
            const storageKey = "chess_tree_theme";
            let theme = "dark";
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved === "dark" || saved === "light") {
                    theme = saved;
                }
            } catch (_error) {
                theme = "dark";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="css/theme.css?v=20260402b" />
    <link rel="stylesheet" href="css/opening.css?v=20260429a" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a href="index.html" class="brand-link" aria-label="ChessTree Home">
            <img class="brand-logo" src="img/new-logo.png" alt="" aria-hidden="true" />
            <span class="brand-text">ChessTree</span>
        </a>

        <nav class="topbar-links" aria-label="Primary">
            <a href="index.html" class="nav-link">
                <svg class="nav-icon nav-icon--home" viewBox="0 0 40 44" fill="none" aria-hidden="true">
                    <path d="M14 42V22H26V42M2 16L20 2L38 16V38C38 39.0609 37.5786 40.0783 36.8284 40.8284C36.0783 41.5786 35.0609 42 34 42H6C4.93913 42 3.92172 41.5786 3.17157 40.8284C2.42143 40.0783 2 39.0609 2 38V16Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Home</span>
            </a>
            <a href="library.html" class="nav-link nav-link--active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20V18.5A2.5 2.5 0 0 0 17.5 16H4V5.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M4 16V18.5A2.5 2.5 0 0 0 6.5 21H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Library</span>
            </a>
            <a href="explorer.html?source=toolbar" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
                    <path d="M22 42C33.0457 42 42 33.0457 42 22C42 10.9543 33.0457 2 22 2C10.9543 2 2 10.9543 2 22C2 33.0457 10.9543 42 22 42Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M30.48 13.52L26.24 26.24L13.52 30.48L17.76 17.76L30.48 13.52Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Explorer</span>
            </a>
            <a href="contact.html" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Contact</span>
            </a>
        </nav>
    </div>
    <div class="topbar-glow" aria-hidden="true"></div>
</header>

<main class="opening-page">
    <section id="openingHeroCard" class="opening-hero-shell" aria-labelledby="openingTitle">
        <div class="opening-hero-preview">
            <nav class="opening-breadcrumb" aria-label="Breadcrumb">
                <a href="library.html">Library</a>
                <span class="opening-breadcrumb__sep">/</span>
                <span id="breadcrumbCurrent">Opening</span>
            </nav>
            <div class="opening-preview-frame">
                <div id="openingPreview" class="opening-board-preview" role="img" aria-label="Opening board preview"></div>
            </div>
        </div>

        <div class="opening-hero-info">
            <div class="opening-hero-utility">
                <a id="backToLibraryLink" class="opening-back-link" href="library.html">
                    <span aria-hidden="true">&larr;</span>
                    <span>Back to Library</span>
                </a>
            </div>
            <h1 id="openingTitle" class="opening-title">Opening</h1>
            <div id="openingMetaGrid" class="opening-meta-grid" aria-live="polite"></div>
            <div id="openingEloSuitability"></div>
            <ul id="openingTips" class="opening-tips" aria-label="How to play this opening" hidden></ul>
            <div class="opening-actions">
                <button
                    id="openExplorerButton"
                    class="action action--primary"
                    type="button"
                >
                    <svg class="nav-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
                        <path d="M22 42C33.0457 42 42 33.0457 42 22C42 10.9543 33.0457 2 22 2C10.9543 2 2 10.9543 2 22C2 33.0457 10.9543 42 22 42Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M30.48 13.52L26.24 26.24L13.52 30.48L17.76 17.76L30.48 13.52Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Explore Opening</span>
                </button>
                <a id="openYoutubeButton" class="action action--youtube" href="#" target="_blank" rel="noopener noreferrer" hidden>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M22 12.2C22 14.42 21.74 16.3 21.34 17.22C21.12 17.74 20.72 18.14 20.2 18.36C19.28 18.76 12 18.76 12 18.76C12 18.76 4.72 18.76 3.8 18.36C3.28 18.14 2.88 17.74 2.66 17.22C2.26 16.3 2 14.42 2 12.2C2 9.98 2.26 8.1 2.66 7.18C2.88 6.66 3.28 6.26 3.8 6.04C4.72 5.64 12 5.64 12 5.64C12 5.64 19.28 5.64 20.2 6.04C20.72 6.26 21.12 6.66 21.34 7.18C21.74 8.1 22 9.98 22 12.2Z" stroke="currentColor" stroke-width="1.8" />
                        <path d="M10 9.65L15.2 12.2L10 14.75V9.65Z" fill="currentColor" />
                    </svg>
                    <span>Watch on YouTube</span>
                </a>
            </div>
        </div>
    </section>

    <section class="variations-section" aria-labelledby="variationsTitle">
        <h2 id="variationsTitle" class="variations-title">Variations</h2>
        <div id="variationsList" class="variations-list"></div>
        <div id="variationsEmpty" class="variations-empty" hidden>Variations in progress.</div>
    </section>
</main>

<div id="explorerReplaceDialog" class="explorer-replace-modal" hidden>
    <div class="explorer-replace-modal__backdrop" data-modal-dismiss="true"></div>
    <div
        class="explorer-replace-modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="explorerReplaceTitle"
        aria-describedby="explorerReplaceMessage"
    >
        <h2 id="explorerReplaceTitle" class="explorer-replace-modal__title">Switch opening?</h2>
        <p id="explorerReplaceMessage" class="explorer-replace-modal__message"></p>
        <div class="explorer-replace-modal__actions">
            <button id="explorerReplaceCancel" class="explorer-replace-modal__btn explorer-replace-modal__btn--secondary" type="button">
                Stay on current
            </button>
            <button id="explorerReplaceConfirm" class="explorer-replace-modal__btn explorer-replace-modal__btn--primary" type="button">
                Open selected
            </button>
        </div>
    </div>
</div>

<script src="js/theme-switcher.js"></script>
<script src="js/toolbar-tooltip.js?v=20260402a"></script>
<script src="js/opening-token.js?v=20260404a"></script>
<script src="js/opening.js?v=20260429a"></script>
<a href="help/getting-started.html" class="help-fab" aria-label="Open help" title="Help" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <path d="M9.9 9.2C10.2 8.2 11 7.5 12.2 7.5C13.5 7.5 14.5 8.3 14.5 9.6C14.5 10.7 13.9 11.3 13.1 11.8C12.3 12.3 12 12.8 12 13.6V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1.2" fill="currentColor"/>
    </svg>
</a>
</body>
</html>
